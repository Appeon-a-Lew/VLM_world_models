id: exp011_pe_norm_pinned
arm: s_f1-pepin                       # leaderboard nickname for RESULTS_phase2.md
# IDEA-101 (planner 2026-11-18, phase 2). Top-ranked queued idea (RESULTS_phase2 §6 item 1, BACKLOG
# ranking #2 after 103 closed). One train arm identical to s_f1 in corpus, seed, LoRA, schedule, style,
# frames, views and tasks; the single intentional change is the OneCanvas stage-1 norm pin on the PE.
hypothesis: >
  (IDEA-101) The PE harm is a magnitude/scale problem, not bad geometry: the xyz branch is added at a
  free scale through a zero-init gate with a 50x learning rate and grows until it disturbs the model's
  metric range instead of adding useful geometry. Pinning each merged token's PE vector norm to half
  the mean visual-feature norm on every forward pass (gate still zero-init, PE lr still 50x) should
  lower Task A val_id target mean from 0.0996 (s_f1, PE on) toward the 0.0127 no-PE floor (s_f1_nope):
  predicted A <= 0.031, i.e. >= 80 % of the 8.7 cm gap closed, because IDEA-103 showed the PE-on error
  is 96 % explained by a per-episode multiplicative range distortion pred ~= s_ep * gt with
  s_ep = 1.043 +- 0.110 (PE off 0.998 +- 0.015) while ray direction and within-scene relative depth are
  already nearly exact (idea103_surface_probe/report.md §3) - a bounded PE should leave the range prior
  alone. Task B follows the perception share only: §3 puts 0.0457 m of s_f1's 0.2146 B val_id error in
  re-anchoring (privileged transfer 0.1689), so predicted B val_id ~0.17, and B val_id must not be
  worse than s_f1 (0.2146). Falsified by A val_id > 0.070 (< 1/3 of the gap closed) or by A falling
  while s_ep stays >= 1.03 (then L2 improves for a reason other than the range distortion).
change: >
  Add the OneCanvas stage-1 norm pin: in XYZEmbedding.forward, rescale the per-token MLP output so that
  each merged token's PE vector norm equals half the mean visual-feature norm of that same forward pass,
  before the gate multiply. Gate init, PE lr (50x), LoRA, corpus v3, seed 0, style box3d, frames "0",
  view 0, tasks A/B/N, token budget and metrics are unchanged vs s_f1.
baseline: s_f1                         # reference arm; s_f1_nope (no-PE floor) is the second reference
reference_no_pe: s_f1_nope
kind: train
train_config: configs/sft_qwen3vl2b.yaml   # unchanged: lr 2e-4, LoRA r16/alpha32, 2 epochs, seed 0
style: box3d
frames: [0]
views: [0]
use_pe: true
tasks: [A, B, N]
ablations: [none, swap]                # image-dependence read-out; 0.1 h, descriptive only (see caveat)
backend: lrz                           # default for a training arm; lab fallback nc-10-4-3, see below
budget_hours: 3                        # no s_f1 wall time is recorded anywhere in research/remote_runs/
                                       # or research/experiments/ (matrix_nc931_20261115/README.md has
                                       # placement, not times), so the 3 h default applies: train
                                       # ~1.2-1.5 h (20k samples x 2 epochs, 5080/H100 step pace
                                       # 1.1-1.5 s/step) + normal inference over validation_splits,
                                       # diag splits and tasks A,B,N (~0.4-0.6 h) + 2 val_id ablations
                                       # (~0.1 h) + the descriptive s_f1 contribution read-out (~0.05 h).
                                       # Fits the LRZ 8 h hard wall with margin for one retry.
seed: 0

implementation:
  - >
    Fresh worktree off main, branch exp/exp011_pe_norm_pinned. No edits to pinned files
    (configs/research_agent_policy.yaml, manifests/final_test.json, physwm/schema.py,
    physwm/geometry.py, physwm/eval/{metrics,evaluate,baselines}.py, physwm/agent/*), none to
    pyproject.toml, physwm/eval/, configs/ or manifests/, and none to the answer format or parser.
    Files touched: physwm/vlm/pe.py, physwm/vlm/sft.py (one call + print-only instrumentation),
    tests/test_pe_norm_pin.py (new). physwm/vlm/infer.py needs no edit: the pin travels in pe.pt.
  - >
    physwm/vlm/pe.py, XYZEmbedding: add `pin_norm: float | None = None` to __init__ and store it as a
    plain Python attribute (self.pin_norm) - never a Parameter or buffer, so state_dict() keys/shapes
    stay byte-identical and s_f1's existing pe.pt still loads and reproduces. Add module constant
    PE_PIN_NORM = 0.5 next to PE_LR_SCALE.
  - >
    physwm/vlm/pe.py, XYZEmbedding.forward: compute `delta = self.mlp(xyz_features(xyz).to(...))`; if
    self.pin_norm is not None, compute `target = self.pin_norm * features.detach().float()
    .norm(dim=-1).mean()` over the N merged tokens of this call and rescale each row
    `delta = delta * (target / delta.detach().float().norm(dim=-1, keepdim=True).clamp_min(1e-6))`;
    then return `features + (self.gate * delta).to(features.dtype)` unchanged. The rescale is in feature
    space (after the MLP, before the gate multiply) because the reference quantity - the mean visual
    feature norm - is `hidden`-dimensional; a pin in the 136-ch code would not be dimensionally
    comparable, and OneCanvas pins the added embedding (research/literature/2026_onecanvas.md,
    "3D position embedding": "In stage 1 the PE norm is pinned to half the mean visual-feature norm").
    The gate stays zero-init and pe_param_groups keeps PE_LR_SCALE = 50.
  - >
    physwm/vlm/pe.py, save_pe/load_pe: save `pin_norm` as an extra top-level dict key
    ({"state_dict":..., "hidden":..., "recipe":..., "pin_norm": module.pin_norm}) and in load_pe pass
    `pin_norm=ckpt.get("pin_norm")` to the constructor (missing key -> None). Old s_f1/s_f1_nope
    checkpoints therefore load unpinned, and eval-only runs on this adapter reproduce the pin without a
    flag. Print `[penorm] loaded pin_norm=<value>` in load_pe.
  - >
    physwm/vlm/sft.py: at the single `install_pe(model)` call site, construct
    `pe = XYZEmbedding(hidden=<merger out_features>, pin_norm=PE_PIN_NORM)` and pass it as
    `install_pe(model, module=pe)` (import PE_PIN_NORM). No CLI flag and no config change - exec.py
    builds the train command from the spec and cannot pass extra args. Print-only instrumentation, on
    every log_every and once at step 0: `[penorm] step n ratio_delta=mean||delta||/mean||features||
    before_pin=... after_pin=... gate=|gate| eff_share=|gate|*0.5 tokens=n` (ratio before/after pin at
    step 0 shows whether the pin amplifies or shrinks the branch at init; eff_share is the added vector
    as a fraction of the feature norm). Never written to a pred file.
  - >
    tests/test_pe_norm_pin.py (preflight gate, `pytest -x tests`): (i) a batch of 7 random feature rows
    and xyz gives per-token ||delta|| == 0.5 * mean||features|| +- 1e-5 when pin_norm=0.5; (ii)
    pin_norm=None reproduces the unpinned forward exactly (torch.equal against a manual gate*mlp
    computation); (iii) state_dict() keys and shapes for pin_norm=None and pin_norm=0.5 are identical;
    (iv) save_pe/load_pe round-trips pin_norm=0.5 and a legacy dict without the key loads as None;
    (v) installing the module via install_pe with a stub merger leaves output == features + gate*delta.
  - >
    Real-data check (no agent.sh op runs custom code on the box, so this is the job.log check): the
    `[penorm]` lines must show after_pin/mean-feature-norm == 0.500 +- 0.01 on every logged step, and
    the final |gate| must be recorded in the report. Run python3 scripts/check_spec.py on this spec,
    commit, keep the worktree clean, submit. Evaluate val_* only: no id_test/ood_* run, no final-test
    manifest, no metric change.

submission_notes:
  backends: >
    Default backend is LRZ (scripts/agent_lrz.sh, partition lrz-hgx-h100-94x4, --gres=gpu:1,
    nice -n 10, 8 h wall, 6 slots) so the arm does not block the lab box for 2-3 h. Acceptable fallback
    is the lab box nc-10-4-3 (idle per the 2026-11-15 placement note) if LRZ stays at Priority; the
    fallback needs the v3 corpus present and the standard venv. One arm, one backend - never both.
  hard_blocker: >
    SUBMISSION IS BLOCKED until `val_ood_config_nocam` exists on the chosen backend. Policy v2.0
    (data.validation_splits) makes every job infer on it, including this one, so a missing split fails
    the arm after training. Check `agent.sh status` / `agent_lrz status` shows
    val_ood_config_nocam in `splits` before submitting. Generation is IDEA-104's first half (LRZ job
    5925914 was queued per research/remote_runs/matrix_nc931_20261115/README.md); if the arm goes to
    the lab box instead, the split must be generated there first - that is a separate queued step, not
    part of this experiment.
  readouts_on_top_of_results: >
    Required read-outs beyond `agent.sh results` (both already exist on main; no code changes):
    (a) IDEA-109 s_ep, from physwm/eval/analyze_pe_surface.py --arm s_f1-pepin --arm s_f1
    --arm s_f1_nope --splits val_id val_ood_config (mechanism diagnostics table, s_ep mean/sd,
    radial share, scale-model residual). This needs the per-episode preds in the site layout and the
    meta cache used by idea103_surface_probe/report.md; if the export is not on the eval box, quote
    the run's own pred jsonl instead and say so.
    (b) paired per-object B/A read-outs from physwm/eval/analyze_motion.py (B, own-A-static,
    GT-static, privileged transfer, transfer - B) for the new arm vs s_f1 and s_f1_nope, per §3.
    (c) descriptive only, ~0.05 h: load s_f1's pe.pt with pin_norm=None and this arm's pe.pt with
    pin_norm=0.5, forward the same first val_id batch, and report the realized added-vector share
    |gate|*mean||delta||/mean||features|| for both. This is the "did the pin bind" check: if s_f1's
    realized share was already <= 0.5, the pin changed nothing and a null result is uninformative.

success_criterion:
  calibration: >
    All from recorded numbers (RESULTS_phase2 §1, §2, §3; idea103_surface_probe/report.md §3), no new
    runs. s_f1 (PE on, seed 0): A val_id 0.0996, B val_id 0.2146, B objects 0.1982, forces 0.5170,
    config 0.2495 (3-split mean 0.3216). s_f1_nope (PE off): A val_id 0.0127, B val_id 0.1423,
    objects 0.1547, forces 0.4912, config 0.2672 (3-split mean 0.3044). PE gap on A val_id = 0.0869;
    seed floor <= 0.004 m per split (s_f1 seed 1: A 0.1012, B 0.2109); policy improvement_threshold
    0.005. IDEA-103: s_ep = 1.043 +- 0.110 (PE on) vs 0.998 +- 0.015 (PE off), scale model explains
    96 % of the PE-on val_id error, tangential error 0.0047 m. §3: 0.0457 m of s_f1's B val_id error is
    perception (transfer 0.1689 vs B 0.2146).
  validity_gate: >
    Interpretable only if parse_rate >= 0.99 and target missing <= 0.01 on every val split, and the
    `[penorm]` lines show after_pin == 0.500 +- 0.01 for >= 95 % of logged steps AND a final |gate| that
    is not ~0 (a gate pinned at 0 means the pinned branch was never used and the arm is a no-op, not a
    test). Gate failure -> treat as invalid, record the cause, and do not read A/B as evidence.
  primary_metric: >
    P = val OOD target mean from `agent.sh results exp011_pe_norm_pinned`; d = P(new arm) - P(s_f1) from
    `agent.sh compare exp011_pe_norm_pinned s_f1` (paired episode bootstrap CI). Pre-registered on the
    paired difference, not on an absolute number: policy v2.0 adds val_ood_config_nocam to
    validation_splits, so the split set of P (and therefore the literal 0.3216) depends on whether
    nocam existed at run time; quote 0.3216 only if it did not. Classes: P_down = d <= -0.005 with CI
    upper < 0; P_up = d >= +0.005; P_flat = otherwise (policy: "comparable"). Always also report vs
    static on the same split set.
  decision_variable_grounding: >
    A = Task A (t = 0) val_id target mean, this arm's required primary read-out (the PE harm is a
    grounding failure, §1). A_fixed = A <= 0.031 AND the paired CI of (A - 0.0996) has upper bound < 0
    (0.031 closes >= 80 % of the 8.7 cm gap and sits ~4.5x the 0.004 seed floor above the 0.0127 no-PE
    floor). A_partial = 0.031 < A <= 0.070 with CI vs s_f1 upper < 0 (33-80 % of the gap closed).
    A_null = A > 0.070, or 0.031 < A with a CI that includes 0 (no established movement from s_f1).
  dynamics_guard: >
    B = Task B val_id target mean must be <= 0.2196 (not worse than s_f1's 0.2146 beyond the 0.005
    comparable band); the strict reading "not worse than s_f1" is B <= 0.2146 and is reported too.
    Secondary guards, reported not routed: objects <= 0.2032, forces <= 0.5220 (both s_f1 + 0.005);
    config_nocam is the pre-registered config read-out once it exists, and legacy val_ood_config
    (s_f1 0.2495) is descriptive only (PLAN reading rule 6). A guard violation is a FAIL for the arm
    even if A_fixed fires: a scale correction that costs dynamics is not a fix.
  verdict_matrix: >
    SUPPORTED = A_fixed AND B <= 0.2196 AND P not P_up: the norm pin removes the PE grounding damage;
    the stage-1 recipe we omitted was the missing piece. WEAK = A_partial AND B <= 0.2196: the pin
    helps but 0.5 is the wrong fraction or the gate re-amplifies (read eff_share). NULL = A_null with
    the validity gate passed. WORSE = A_null AND P_up, or any dynamics-guard violation.
  s_ep_readout: >
    Required and routed as a mechanism check, not a success criterion: s_ep_fixed = mean <= 1.01 and
    sd <= 0.03 (at least half of the 0.045 excess over 0.998 removed); s_ep_unchanged = mean >= 1.03 or
    sd >= 0.08. A_fixed + s_ep_fixed = the metric range was the whole story. A_fixed + s_ep_unchanged =
    L2 fell for another reason (report it, do not claim the distortion was fixed). A_partial/null +
    s_ep_unchanged = the norm channel does not govern the scale prior.
  routing:
    R1_pin_fixes_grounding: >
      (A_fixed, B guard ok). SUPPORTED. Next: IDEA-104's nocam rescoring is already implied and decides
      whether the PE still buys anything over s_f1_nope on the phase-2 config axis (s_f1 0.2495 vs
      s_f1_nope 0.2672 on the legacy split); then IDEA-105 seed-1 for this arm before any reported gain
      below ~0.008. The norm question is closed: record that the stage-1 pin is the minimal recipe, and
      the "PE carries usable signal" question reduces to the nocam column. Do not tune the pin fraction
      (a new idea, planned only if R1 fires and nocam shows a real PE benefit).
    R2_pin_helps_below_threshold: >
      (A_partial, B guard ok). WEAK. Report with CIs; do not adopt. Check eff_share: |gate| >> 1 means
      the pin bounded the representation but not the contribution, so the next single knob is IDEA-102
      (PE lr 5x, which attacks the same branch from the optimizer side, 3-6 GPU-h) rather than a second
      pin variant. |gate| ~ 1 with A_partial means the pin works and 0.5 is too tight; that is a new
      idea (pin fraction), queued behind 102 only if 102 is null.
    R3_null_no_takeover: >
      (A_null, B guard ok). The bounded-norm account of the PE harm is wrong. IDEA-102 (lr 5x) becomes
      the decisive next arm because it separates "the branch moves too fast" (optimization order) from
      "the branch is the wrong input at any scale" (representation): if 5x also leaves A near 0.10 then
      no PE-magnitude knob works, s_f1_nope is the reference arm, and the geometry route moves to
      IDEA-107 (2 views, expensive) / IDEA-108 (estimated depth, eval-only). If 5x lands near the no-PE
      floor, LR was the whole story and 101/102 collapse into one cheap config change.
    R4_null_s_ep_fell: >
      (A_null, s_ep_fixed). Internal inconsistency: the scale factor moved but the L2 did not, so the
      scale model is not the L2 mechanism at this magnitude (its 0.020 m residual would predict ~0.020 m
      A on val_id). Report both and treat idea103's 96 % variance-explained claim as provisional on
      s_f1 only; do not adopt the pin.
    R5_worse_or_guard_violation: >
      (P_up, or B/objects/forces guard violation, or A_null with A > 0.0996). Stop the PE-magnitude
      line: 101 and 102 both drop in priority, s_f1_nope stays the reference, and the report says the
      PE branch is not repairable by scale control in this single-view, 2-epoch, 50x-lr regime.
    R6_invalid: >
      Validity gate failed (parse/missing, or the pin did not bind). No conclusion; fix and rerun once
      under a new id only if the cause is an implementation bug (recorded as a deviation).
  if_it_fails: >
    A null is informative, not wasted: it falsifies the "PE magnitude takeover" reading of §1 at 20x
    the seed floor, which is exactly what decides between IDEA-102 (optimizer-order explanation, still
    open) and the geometry route (107/108) - so the information value is high in every branch. It also
    tells us whether the PE carries usable grounding signal at all: if A returns to the s_f1_nope
    floor with B ~0.17 and s_ep ~1.00, the PE adds nothing in-distribution and only a nocam config
    benefit (0.2495 vs 0.2672, one seed, legacy camera-confounded split) could justify keeping it.
    Single seed: a difference below 0.008 (2x the measured 0.004 floor) is not called an improvement
    without IDEA-105; differences under 0.005 are "comparable" by policy.

report_must_quote:
  - "agent.sh results: metrics.json (primary, taskA_val_id_all_mean, gap, parse, missing) and results.md rows for val_id, val_ood_objects, val_ood_forces, val_ood_config, val_ood_config_nocam (if present) and the diag splits, Task A and Task B target, normal pass"
  - "agent.sh compare exp011_pe_norm_pinned s_f1 (primary, paired CI) and --splits for val_id, objects, forces, config[_nocam]; and compare vs s_f1_nope for the same splits; static on the same split set"
  - "Task A val_id target mean next to the 0.0996 and 0.0127 references, with the paired CI vs both, and the one sentence 'single seed; differences under 0.008 not interpreted without IDEA-105'"
  - "s_ep mean and sd on val_id (and val_ood_config + nocam if available) for this arm, s_f1 and s_f1_nope from analyze_pe_surface.py mechanism diagnostics, plus radial share and scale-model residual"
  - "the analyze_motion.py paired per-object table (B, own-A-static, GT-static, privileged transfer, transfer - B) for this arm vs s_f1 and s_f1_nope on val_id, per PLAN reading rule 4"
  - "the [penorm] lines verbatim: after_pin/mean-feature-norm on the last logged step, final |gate|, effective added-vector share, and the descriptive s_f1 vs pinned realized-share comparison (the 'did the pin bind' check)"
  - "which of R1-R6 fired and what it changes for IDEA-102 and for the 'PE carries usable signal' question"
  - "the image-dependence gap (none minus normal, swap minus normal) on val_id, labelled descriptive and a lower bound: under --image-mode none the PE still receives GT depth xyz, so the PE path is not blanked (research/literature/2026_onecanvas.md, 'Image dependence')"

out_of_scope:
  - "Any change to the PE lr (that is IDEA-102), the pin fraction other than 0.5, the gate initialisation, the MLP width, the 136-ch recipe, or the LoRA/epochs/token budget - one change only."
  - "Any edit to physwm/eval/, physwm/agent/, configs/, manifests/, pyproject.toml, the answer format or the parser; any new dependency; any id_test/ood_* or final-test run."
  - "Generating val_ood_config_nocam inside this experiment (IDEA-104's generation job; this arm only requires that the split already exists)."
  - "Adopting the arm or publishing numbers on the basis of a single seed, or on legacy val_ood_config alone (camera-confounded, PLAN reading rule 6)."
