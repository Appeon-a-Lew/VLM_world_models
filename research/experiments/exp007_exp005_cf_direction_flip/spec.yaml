id: exp007_exp005_cf_direction_flip
# IDEA-026 (first of the 026 -> 025 pair), planner 2026-10-25. Routed by exp006 report + review_post
# (R-A..R-C not firing in the clean form, G3 / "other combination" -> IDEA-025/026). 025 (impulse x0.5/x2) is a
# separate change and becomes exp008, so this spec has exactly one intentional change. Combining them was rejected:
# two prompt interventions in one job would make a failed parse/anomaly un-attributable, and the marginal GPU
# saving is tiny because exec.py always reruns `normal` on all splits (~0.23 h fixed cost either way).
# Reviewer point (exp006 review_post, "Alternatives" 3): the push direction is given as TEXT, so this flip is also
# the direct probe of whether the model uses the text direction (and hence whether the exp006 LR/AT split probed
# anything about the image frame).
hypothesis: >
  The exp005 adapter reads the push direction from the action text. Prediction (direction: reads the text):
  on val_id, when the direction phrase is swapped to its opposite (left<->right, away<->toward) with image and
  impulse fixed, the model's own displacement (B_hat - A_hat of the target) reverses, so its projection on the
  originally stated direction flips sign (pooled iso gain_flip <= -0.5, versus +0.95 for the unflipped prompt in
  exp006), and the pinned Task B target error rises to >= 1.5x the unflipped error. Falsified (direction:
  ignores the text, scene prior) if gain_flip stays >= +0.5 and the error ratio <= 1.15.
change: >
  eval_only re-run of the exp005 adapter with one extra ablation mode `cf_flip` on val_id: the Task B prompt's
  direction phrase (ep.action.text) is replaced by the opposite phrase; image, impulse, objects and answer format
  unchanged.
baseline: exp006_exp005_direction_split
kind: eval_only
lora: /var/tmp/toyi/wm/experiments/exp005_exp000_repro/model/adapter
style: center
ablations: [cf_flip]
budget_hours: 0.6
seed: 0
# No eval_limit and no batch_size (keeps `normal` bit-exact with exp005/exp006 as the control).

implementation:
  - >
    Fresh worktree off main, cherry-pick exp006's code (the exp004 hunk 6052307 plus exp006's direction_readout
    and prints, commit 75ebbfd and a93dfa4) so derived.oracleanchor / direction_readout are available. Do not touch
    exec.py, metrics.py, baselines.py, schema.py, pyproject.toml (pinned or protected).
  - >
    physwm/vlm/prompts.py: add FLIP = {"to the left": "to the right", "to the right": "to the left",
    "away from the camera": "toward the camera", "toward the camera": "away from the camera"} and
    flip_action_text(text) -> str that swaps the phrase (assert exactly one phrase occurs, else raise). Add an
    optional argument prompt_text(ep, task, style, cf_flip=False) that, only for task B and cf_flip=True, uses the
    flipped text. Default path is byte-identical (a unit test checks prompt_text(...) is unchanged for cf_flip=False).
  - >
    physwm/vlm/infer.py: add "cf_flip" to the --image-mode choices. For cf_flip, load the NORMAL image
    (load_image mode "normal") and pass cf_flip=True to prompt_text. exec.py's ablation loop already passes
    `--image-mode cf_flip` on the pinned ablation split (val_id), writes pred/cf_flip.jsonl, and the pinned scorer
    reports it as exp007:cf_flip against the REAL GT. The record's image_mode field says cf_flip.
  - >
    physwm/vlm/infer.py (print-only, after the cf_flip run finishes): for val_id iso episodes, reuse
    derived.direction_readout on the cf_flip oracle-anchored rows and print "[cf-flip] " lines (leading newline,
    flush=True) per group LR / AT / pooled: n, gain_flip (mean pd.ghat/||gt1-gt0||, ghat = GT direction, i.e. the
    ORIGINALLY stated direction), sign_agree_orig = P(pd.ghat > 0), e, K, and bootstrap 95% CIs (1000 resamples,
    default_rng(0)) for pooled gain_flip and for the error ratio e_flip/e_normal. The normal-prompt counterpart
    (gain 0.92 LR / 0.97 AT on val_id, exp006 [direction] lines) is the control; also print the normal-prompt sign
    agreement computed from the same function on the normal rows in the same process if available in memory
    (the cf_flip run is a separate process, so re-derive it from exp006's job.log numbers if not). Privileged
    diagnostic (GT t=0 anchor), label it so. Write nothing new to normal.jsonl or none.jsonl.
  - >
    tests/test_prompts or tests/test_derived: (1) flip_action_text swaps each of the 4 phrases and is an
    involution; (2) cf_flip=False output identical to the old prompt; (3) a task-A prompt is unchanged when
    cf_flip=True (Task A has no action text). `pytest -x tests` is the preflight gate.
  - >
    Commit spec + code, run `python3 scripts/check_spec.py` on the worktree spec, keep the worktree clean, submit.
    Pre-review should check that `git diff main...HEAD` adds only the flip, the choice entry and the prints.

success_criterion:
  primary_metric: >
    No model change; the primary val_ood_target_mean must reproduce exp005: 0.3160 +/- 0.005 and `compare` against
    exp005_exp000_repro per_split_diff exactly 0.0 on the 3 OOD splits (otherwise report "stack drift" and apply no
    routing). The experiment's readout is the cf_flip row on val_id (target_mean vs normal, same split), not the
    primary (improvement_threshold is not applicable; this is a diagnostic).
  objective_link: >
    Decides whether the forces gain (C-002) and the LR/AT null (exp006) rest on a model that uses the action, and
    which 1.4 GPU-h run is next (IDEA-002 vs IDEA-014).
  if_it_fails: >
    If cf_flip parses badly (parse_rate < 0.95) the flip is out-of-distribution phrasing for the adapter and the
    D-READ / D-IGNORE calls are void; report only the parse rate and route to 025 anyway.

decision_criteria:
  validity: >
    normal metrics reproduce exp005 (above); cf_flip parse_rate >= 0.95; n_iso LR and AT each >= 30 on val_id
    (197 / 198 expected); no "[cf-flip] FAILED" line. Thresholds are on point estimates; any call whose bootstrap
    CI crosses its threshold is flagged "point-estimate only" and routes as D-PARTIAL.
  pre_registered_routing: >
    Written before any [cf-flip] line or cf_flip score is read. Quantities (val_id, pooled iso, privileged
    diagnostic for gain/sign): gain_flip, sign_agree_orig, pinned ratio R = target_mean(cf_flip) / target_mean(normal).
    Reference unflipped values: gain 0.95, sign_agree presumably ~0.9 (exp006).
    D-READ: gain_flip <= -0.5 AND sign_agree_orig <= 0.25 AND R >= 1.5. The model uses the text direction.
      Routing: exp008 = IDEA-025 (impulse x0.5 / x2) for the magnitude half. IDEA-002 is NOT promoted by this result
      (the action is used, so the forces gain is not a pure prior); IDEA-014 (perception, exp004 R1/R2) stays the
      next training lever; IDEA-016 stays unpromoted (exp006) and the LR/AT split is reinterpreted as a probe of
      text-driven direction plus image-frame perception together, no separate frame claim.
    D-IGNORE: gain_flip >= +0.5 AND sign_agree_orig >= 0.7 AND R <= 1.15. The direction in the text is not used;
      the direction comes from the scene/training prior (aim_at_other_prob 0.4 makes it guessable).
      Routing: promote IDEA-002 (explicit displacement / action-grounded output) ahead of IDEA-014 on action
      grounds, regardless of the config analyses; C-002's forces gain is flagged as a prior; exp008 = IDEA-025 is
      still run but as a lower-priority confirmation (an ignored direction predicts an ignored impulse). IDEA-016
      is demoted further (the camera frame cannot matter if the text direction is unused: it needs the
      direction read first). IDEA-014 is unchanged.
    D-PARTIAL: everything else, including -0.5 < gain_flip < 0.5, or a CI-crossing call, or LR and AT disagree
      (one group READ, the other IGNORE; report per group and flag it as direction-dependent). Routing: exp008 =
      IDEA-025; no training run; no change to IDEA-002/014/016 priority.
    Parse caveat: if the flipped prompt raises the unparsed rate, R is computed on parsed episodes only and the
    call is flagged.
    Not claimed by any outcome: that the model "understands" physics; forces-split behaviour (the pinned ablation
    split is val_id, forces needs a separate pinned-code change); a scored counterfactual (the flipped GT needs a
    re-simulation, human).

report_must_quote:
  - "agent.sh results: metrics.json, results.md rows exp007:normal and exp007:cf_flip on val_id, and the compare against exp005_exp000_repro"
  - "agent.sh log exp006... not needed; agent.sh log exp007_exp005_cf_direction_flip 600: every strata and [cf-flip] line"
  - "gain_flip, sign_agree_orig and R with CIs, pooled and LR / AT, and which of D-READ / D-IGNORE / D-PARTIAL fired"
  - "the sentence 'privileged diagnostic, uses GT t=0; not a model result' next to every gain / sign number"

out_of_scope:
  - "IDEA-025 impulse scaling (exp008), IDEA-053 per-axis error, IDEA-054 recall sweep (separate specs)."
  - "Counterfactual runs on val_ood_forces (needs a pinned exec.py change, needs-human)."
  - "Any training run (IDEA-002/014/016) until this routing is read."
